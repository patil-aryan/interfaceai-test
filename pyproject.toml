[project]
name = "computer-use-automation-system"
version = "0.1.0"
description = "Record-once, replay-many computer-use automation for legacy back-office applications"
requires-python = ">=3.12"

# What the engine itself needs. Kept to what is actually imported today;
# anthropic (discovery) and fastapi/uvicorn (console) arrive with those pieces.
dependencies = [
    "pydantic>=2.9",
    "playwright>=1.48",
]

[project.optional-dependencies]
# The fake bank is a test fixture, not part of the system. Installing the
# engine must not drag in a web framework it never imports.
fixture = ["flask>=3.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/computer_use"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
