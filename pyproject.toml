[project]
name = "computer-use-automation-system"
version = "0.1.0"
description = "Record-once, replay-many computer-use automation for legacy back-office applications"
requires-python = ">=3.12"

# Exactly what the engine imports. The model client and the test fixture are
# separate extras, so installing the production path pulls in neither.
dependencies = [
    "pydantic>=2.9",
    "playwright>=1.48",
]

[project.optional-dependencies]
# The fake bank is a test fixture, not part of the system. Installing the
# engine must not drag in a web framework it never imports.
fixture = ["flask>=3.0"]
# Only the discovery loop talks to a model. Replay is the production path and
# never needs a model client, so installing it must not pull one in.
discovery = ["anthropic>=0.40"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/computer_use"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    # The engine promises to always return a ReplayResult, so every place an
    # exception could escape catches broadly and turns it into data. The same
    # applies to condition detectors and evidence capture, where an error means
    # "not true yet" or "could not be collected", never "crash the run".
    "BLE001",
    "S112",
]
