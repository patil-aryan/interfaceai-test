[project]
name = "computer-use-automation-system"
version = "0.1.0"
description = "Record-once, replay-many computer-use automation for legacy back-office applications"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "playwright>=1.48",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "flask>=3.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
computer-use = "computer_use.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/computer_use"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
